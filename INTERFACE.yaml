# Module Input-Output structure for automated docs generation
convention_version: v1.0.0

pathvars:
  snakemake_defaults:
    logs:
      default: "<logs>"
      description: location of snakemake log files.
    resources:
      default: "<resources>"
      description: "location of module resource (input) files."
    results:
      default: "<results>"
      description: "location of module result (output) files."
  user_resources:
    shapes:
      default: "<resources>/user/{shapes}/shapes.parquet"
      description: Land polygons with shape, country, class, and geometry columns.
  results:
    floor_area:
      default: "<results>/{shapes}/rasters/floor_area.tif"
      description: Residential, commercial/public, and total gross floor area per hectare. Produced together with residential_space_heat_weight.
    residential_space_heat_weight:
      default: "<results>/{shapes}/rasters/residential_space_heat_weight.tif"
      description: Population-informed hectare support weights for allocating national residential space-heating demand. Produced together with floor_area; no commercial/public heat weight.
wildcards:
  shapes: Name of the provided shape set.
