$schema: "https://json-schema.org/draft/2020-12/schema"
description: "Schema for district-heating regionalisation settings."
type: object
additionalProperties: false
required: [floor_area, heat_demand, raster]
properties:
  floor_area:
    type: object
    additionalProperties: false
    required: [reference_year, useful_to_gross_ratio, floor_space_m2, rooms, floor_area_per_room_m2]
    properties:
      reference_year: {type: integer, const: 2021}
      useful_to_gross_ratio: {type: number, exclusiveMinimum: 0}
      floor_space_m2:
        type: object
        additionalProperties: {type: number, exclusiveMinimum: 0}
        minProperties: 9
        maxProperties: 9
      rooms:
        type: object
        additionalProperties: {type: number, exclusiveMinimum: 0}
        minProperties: 9
        maxProperties: 9
      floor_area_per_room_m2: {type: number, exclusiveMinimum: 0}
  heat_demand:
    type: object
    additionalProperties: false
    required: [end_uses, categories]
    properties:
      end_uses:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string}
      categories:
        type: object
        minProperties: 1
        additionalProperties:
          type: string
          enum: [residential, non_residential]
  raster:
    type: object
    additionalProperties: false
    required: [cell_size_m, dtype, nodata, compression, block_size]
    properties:
      cell_size_m: {type: number, const: 100}
      dtype: {type: string, enum: [float32, float64]}
      nodata: {type: number}
      compression: {type: string, enum: [deflate, lzw, zstd]}
      block_size: {type: integer, minimum: 16, multipleOf: 16}
