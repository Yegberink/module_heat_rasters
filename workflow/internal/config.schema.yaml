$schema: "https://json-schema.org/draft/2020-12/schema"
description: "Schema for district-heating regionalisation settings."
type: object
additionalProperties: false
required: [floor_area, data_proxies, heat_demand, raster]
properties:
  floor_area:
    type: object
    additionalProperties: false
    required: [reference_year, ghsl_epoch, ghsl_resolution, ghsl_chunk_size, nuts3_batches, eubucco, useful_to_gross_ratio, floor_space_m2, rooms, floor_area_per_room_m2]
    properties:
      reference_year: {type: integer, const: 2021}
      ghsl_epoch:
        type: integer
        enum: [1975, 1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2020, 2025, 2030]
      ghsl_resolution: {type: integer, const: 100}
      ghsl_chunk_size: {type: integer, minimum: 256, multipleOf: 256}
      nuts3_batches: {type: integer, minimum: 1}
      eubucco:
        type: object
        additionalProperties: false
        required: [version, residential_type, commercial_subtypes, assignment, floor_bin_representatives]
        properties:
          version: {type: string, const: "0.2"}
          residential_type: {type: string, const: residential}
          commercial_subtypes:
            type: array
            const: [commercial, public]
          assignment: {type: string, const: centroid}
          floor_bin_representatives:
            type: object
            additionalProperties: false
            required: [n_floors_0_2, n_floors_2_4, n_floors_4_7, n_floors_7_inf]
            properties:
              n_floors_0_2: {type: number, exclusiveMinimum: 0}
              n_floors_2_4: {type: number, exclusiveMinimum: 0}
              n_floors_4_7: {type: number, exclusiveMinimum: 0}
              n_floors_7_inf: {type: number, exclusiveMinimum: 0}
      useful_to_gross_ratio: {type: number, exclusiveMinimum: 0}
      floor_space_m2:
        type: object
        additionalProperties: {type: number, exclusiveMinimum: 0}
        minProperties: 9
        maxProperties: 9
      rooms:
        type: object
        additionalProperties: {type: number, exclusiveMinimum: 0}
        minProperties: 9
        maxProperties: 9
      floor_area_per_room_m2: {type: number, exclusiveMinimum: 0}
  data_proxies:
    type: object
    additionalProperties: false
    required: [residential_floor_area, microsoft]
    properties:
      residential_floor_area: {$ref: "#/$defs/country_proxies"}
      microsoft:
        type: object
        additionalProperties: false
        required: [release, countries]
        properties:
          release: {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}
          countries:
            type: object
            propertyNames: {pattern: "^[A-Z]{3}$"}
            additionalProperties: {$ref: "#/$defs/microsoft_country"}
  heat_demand:
    type: object
    additionalProperties: false
    required: [end_uses, categories]
    properties:
      end_uses:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string}
      categories:
        type: object
        minProperties: 1
        additionalProperties:
          type: string
          enum: [residential, non_residential]
  raster:
    type: object
    additionalProperties: false
    required: [crs, cell_size_m, dtype, nodata, compression, block_size, plot_max_size]
    properties:
      crs: {type: string, const: auto}
      cell_size_m: {type: number, const: 100}
      dtype: {type: string, enum: [float32, float64]}
      nodata: {type: number}
      compression: {type: string, enum: [deflate, lzw, zstd]}
      block_size: {type: integer, minimum: 16, multipleOf: 16}
      plot_max_size: {type: integer, minimum: 1}
$defs:
  country_list:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, pattern: "^[A-Z]{3}$"}
  microsoft_country:
    type: object
    additionalProperties: false
    required: [floor_area, sector_split]
    properties:
      floor_area:
        oneOf:
          - type: object
            additionalProperties: false
            required: [method, parameters]
            properties:
              method: {const: reference_countries}
              parameters:
                type: object
                additionalProperties: false
                required: [countries, estimator]
                properties:
                  countries: {$ref: "#/$defs/country_list"}
                  estimator: {enum: [area_per_dwelling, mean_floors]}
          - type: object
            additionalProperties: false
            required: [method, parameters]
            properties:
              method: {const: user_specified}
              parameters:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [estimator, gross_floor_area_per_dwelling_m2, persons_per_dwelling]
                    properties:
                      estimator: {const: area_per_dwelling}
                      gross_floor_area_per_dwelling_m2: {type: number, exclusiveMinimum: 0}
                      persons_per_dwelling: {type: number, exclusiveMinimum: 0}
                  - type: object
                    additionalProperties: false
                    required: [estimator, mean_floors]
                    properties:
                      estimator: {const: mean_floors}
                      mean_floors: {type: number, exclusiveMinimum: 0}
      sector_split:
        oneOf:
          - type: object
            additionalProperties: false
            required: [method, parameters]
            properties:
              method: {const: reference_countries}
              parameters:
                type: object
                additionalProperties: false
                required: [countries]
                properties:
                  countries: {$ref: "#/$defs/country_list"}
          - type: object
            additionalProperties: false
            required: [method, parameters]
            properties:
              method: {const: user_specified}
              parameters:
                type: object
                additionalProperties: false
                required: [shares]
                properties:
                  shares:
                    type: object
                    additionalProperties: false
                    required: [residential, non_residential]
                    properties:
                      residential: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}
                      non_residential: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}
  country_proxies:
    type: object
    propertyNames: {pattern: "^[A-Z]{3}$"}
    additionalProperties:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, pattern: "^[A-Z]{3}$"}
