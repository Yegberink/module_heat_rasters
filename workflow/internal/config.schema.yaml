$schema: "https://json-schema.org/draft/2020-12/schema"
description: "Schema for floor-area raster settings."
type: object
additionalProperties: false
required: [buildings_microsoft, buildings_eubucco, population_ghsl, eurostat, space_heat_weight, data_proxies, raster]
allOf:
  - if:
      properties:
        space_heat_weight:
          properties:
            surface_volume:
              properties:
                method: {const: footprint_perimeter}
    then:
      properties:
        buildings_eubucco:
          properties:
            source: {const: full}
properties:
  buildings_microsoft:
    type: object
    additionalProperties: false
    required: [release, minimum_building_count]
    properties:
      release: {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}
      minimum_building_count: {type: integer, minimum: 0}
  buildings_eubucco:
    type: object
    additionalProperties: false
    required: [nuts3_batches, version, source, residential_type, commercial_subtypes, assignment, floor_bin_representatives]
    properties:
      nuts3_batches: {type: integer, minimum: 1}
      version: {type: string, const: "0.2"}
      source: {type: string, enum: [lightweight, full]}
      residential_type: {type: string, const: residential}
      commercial_subtypes:
        type: array
        const: [commercial, public]
      assignment: {type: string, const: centroid}
      floor_bin_representatives:
        type: object
        additionalProperties: false
        required: [n_floors_0_2, n_floors_2_4, n_floors_4_7, n_floors_7_inf]
        properties:
          n_floors_0_2: {type: number, exclusiveMinimum: 0}
          n_floors_2_4: {type: number, exclusiveMinimum: 0}
          n_floors_4_7: {type: number, exclusiveMinimum: 0}
          n_floors_7_inf: {type: number, exclusiveMinimum: 0}
  population_ghsl:
    type: object
    additionalProperties: false
    required: [epoch, resolution, chunk_size]
    properties:
      epoch:
        type: integer
        enum: [1975, 1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2020, 2025, 2030]
      resolution: {type: integer, const: 100}
      chunk_size: {type: integer, minimum: 256, multipleOf: 256}
  eurostat:
    type: object
    additionalProperties: false
    required: [reference_year, useful_to_gross_ratio, floor_space_m2, rooms, floor_area_per_room_m2]
    properties:
      reference_year: {type: integer, const: 2021}
      useful_to_gross_ratio: {type: number, exclusiveMinimum: 0}
      floor_space_m2:
        type: object
        additionalProperties: {type: number, exclusiveMinimum: 0}
        minProperties: 9
        maxProperties: 9
      rooms:
        type: object
        additionalProperties: {type: number, exclusiveMinimum: 0}
        minProperties: 9
        maxProperties: 9
      floor_area_per_room_m2: {type: number, exclusiveMinimum: 0}
  space_heat_weight:
    type: object
    additionalProperties: false
    required: [nuts3_batches, population, surface_volume, age]
    properties:
      nuts3_batches: {type: integer, minimum: 1}
      population:
        type: object
        additionalProperties: false
        required: [share, resampling]
        properties:
          share: {type: number, minimum: 0, maximum: 1}
          resampling: {type: string, const: sum}
      surface_volume:
        type: object
        additionalProperties: false
        required: [elasticity, method]
        properties:
          elasticity: {type: number, minimum: 0}
          method: {type: string, enum: [equivalent_square, footprint_perimeter]}
      age:
        type: object
        additionalProperties: false
        required: [enabled, dataset, multipliers, cutoff_spanning_bin_multipliers]
        properties:
          enabled: {type: boolean}
          dataset: {type: string, const: cens_21dwop_r3}
          multipliers:
            type: object
            additionalProperties: false
            required: [before_1991, "1991_2000", after_2000]
            properties:
              before_1991: {type: number, exclusiveMinimum: 0}
              "1991_2000": {type: number, exclusiveMinimum: 0}
              after_2000: {type: number, exclusiveMinimum: 0}
          cutoff_spanning_bin_multipliers:
            type: object
            additionalProperties: false
            required: [Y1981-2000]
            properties:
              Y1981-2000: {type: number, exclusiveMinimum: 0}
  data_proxies:
    type: object
    additionalProperties: false
    required: [method, countries]
    properties:
      method: {type: string, const: mean_floors}
      countries: {$ref: "#/$defs/country_proxies"}
  raster:
    type: object
    additionalProperties: false
    required: [crs, cell_size_m, dtype, nodata, compression, block_size, plot_max_size, plot_outline]
    properties:
      crs: {type: string, const: auto}
      cell_size_m: {type: number, const: 100}
      dtype: {type: string, enum: [float32, float64]}
      nodata: {type: number}
      compression: {type: string, enum: [deflate, lzw, zstd]}
      block_size: {type: integer, minimum: 16, multipleOf: 16}
      plot_max_size: {type: integer, minimum: 1}
      plot_outline:
        type: object
        additionalProperties: false
        required: [color, linewidth]
        properties:
          color: {type: string, pattern: "^#[0-9a-fA-F]{6}$"}
          linewidth: {type: number, exclusiveMinimum: 0}
$defs:
  country_proxies:
    type: object
    propertyNames: {pattern: "^[A-Z]{3}$"}
    additionalProperties:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, pattern: "^[A-Z]{3}$"}
