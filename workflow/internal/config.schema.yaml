$schema: "https://json-schema.org/draft/2020-12/schema"
description: "Schema for district-heating regionalisation settings."
type: object
additionalProperties: false
required: [floor_area, data_proxies, heat_demand, raster]
properties:
  floor_area:
    type: object
    additionalProperties: false
    required: [reference_year, ghsl_epoch, ghsl_resolution, ghsl_chunk_size, eubucco, useful_to_gross_ratio, floor_space_m2, rooms, floor_area_per_room_m2]
    properties:
      reference_year: {type: integer, const: 2021}
      ghsl_epoch:
        type: integer
        enum: [1975, 1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2020, 2025, 2030]
      ghsl_resolution: {type: integer, const: 100}
      ghsl_chunk_size: {type: integer, minimum: 256, multipleOf: 256}
      eubucco:
        type: object
        additionalProperties: false
        required: [version, source_strategy, regional_max_fraction, residential_type, commercial_subtypes, assignment]
        properties:
          version: {type: string, const: "0.2"}
          source_strategy: {type: string, enum: [auto, regional, lightweight]}
          regional_max_fraction:
            type: number
            exclusiveMinimum: 0
            maximum: 1
          residential_type: {type: string, const: residential}
          commercial_subtypes:
            type: array
            const: [commercial, public]
          assignment: {type: string, const: centroid}
      useful_to_gross_ratio: {type: number, exclusiveMinimum: 0}
      floor_space_m2:
        type: object
        additionalProperties: {type: number, exclusiveMinimum: 0}
        minProperties: 9
        maxProperties: 9
      rooms:
        type: object
        additionalProperties: {type: number, exclusiveMinimum: 0}
        minProperties: 9
        maxProperties: 9
      floor_area_per_room_m2: {type: number, exclusiveMinimum: 0}
  data_proxies:
    type: object
    additionalProperties: false
    required: [residential_floor_area, commercial_floor_area]
    properties:
      residential_floor_area: {$ref: "#/$defs/country_proxies"}
      commercial_floor_area: {$ref: "#/$defs/country_proxies"}
  heat_demand:
    type: object
    additionalProperties: false
    required: [end_uses, categories]
    properties:
      end_uses:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string}
      categories:
        type: object
        minProperties: 1
        additionalProperties:
          type: string
          enum: [residential, non_residential]
  raster:
    type: object
    additionalProperties: false
    required: [cell_size_m, dtype, nodata, compression, block_size, plot_max_size]
    properties:
      cell_size_m: {type: number, const: 100}
      dtype: {type: string, enum: [float32, float64]}
      nodata: {type: number}
      compression: {type: string, enum: [deflate, lzw, zstd]}
      block_size: {type: integer, minimum: 16, multipleOf: 16}
      plot_max_size: {type: integer, minimum: 1}
$defs:
  country_proxies:
    type: object
    propertyNames: {pattern: "^[A-Z]{3}$"}
    additionalProperties:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, pattern: "^[A-Z]{3}$"}
